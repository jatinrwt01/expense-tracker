<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo"><img src="assets/images/logo.png" alt=""></div>
      <nav class="sidebar-nav">
        <ul>
          <li>Dashboard</li>
          <li>Transactions</li>
          <li>Analytics</li>
          <li>Settings</li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-navbar">
        <h1>Expense Tracker Dashboard</h1>
        <div class="navbar-actions">
        <button><img class="dark-mode-toggle " src="assets/icons/darkmode.svg" alt="darkmode"></button>
       <button><img class="user-profile" src="assets/icons/usericon.png" alt="profile"></button>
      <button><img class="notification" src="assets/icons/notificationicon.png" alt="notification"></button>  
      </div>
      </header>

      <section class="summary-cards">
        <div class="card balance-card">
          <h3>Total Balance</h3>
          <p id="total-balance"></p>
        </div>

        <div class="card income-card">
          <h3>Total Income</h3>
          <p>₹40,000</p>
        </div>

        <div class="card expense-card">
          <h3>Total Expense</h3>
          <p id="total-expense"></p>
        </div>
      </section>

   <section class="analytics">
    <div class="chart-card">
        <div class="chart-header">
            <h2>Expense Analytics</h2>
        </div>
        <div class="chart-body">
            <canvas id="expenseChart"></canvas>
        </div>
    </div>
</section>

      <section class="bottom-section">
        <section class="transactions">
          <div class="transaction-header">
          <h2>Recent Transactions</h2>
            </div>
          <ul class="transaction-list">
            <li class="transaction-item">
              <div class="transaction-info">
                <h4>Groceries</h4>
                <p>Food • 20 May 2026</p>
              </div>

              <div class="transaction-actions">
                <span>₹500</span>
                <button class="btn">Delete</button>
              </div>
            </li>
          </ul>
        </section>

        <section class="add-expense">
          <div class="expense-header">
          <h2>Add Expense</h2>
            </div>
          <form class="expense-form">
            <input id="expense-title" type="text" placeholder="Expense Title" />

            <input id="amount" type="number" placeholder="Amount" />

            <select id="category">
              <option>Food</option>
              <option>Transport</option>
            </select>

            <input id="date" type="date" />

            <button class="btn" type="submit">Add Transaction</button>
          </form>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
