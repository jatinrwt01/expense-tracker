<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo"><img src="assets/images/logo.png" alt=""></div>
      <nav class="sidebar-nav">
        <ul>
          <li>Dashboard</li>
          <li>Transactions</li>
          <li>Analytics</li>
          <li>Settings</li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-navbar">
        <h1>Expense Tracker Dashboard</h1>
        <div class="navbar-actions">
        <button id="theme-toggle">
        <i id="theme-icon" data-lucide="moon"></i>
        </button>

        <button>
         <i data-lucide="bell"></i>
        </button>

        <button>
        <i data-lucide="user"></i>
        </button>
      </div>
      </header>

      <section class="summary-cards">
        <div class="card balance-card">
          <h3>Total Balance</h3>
          <p id="total-balance"></p>
        </div>

        <div class="card income-card">
          <h3>Total Income</h3>
          <p>₹40,000</p>
        </div>

        <div class="card expense-card">
          <h3>Total Expense</h3>
          <p id="total-expense"></p>
        </div>
      </section>

   <section class="analytics">
    <div class="chart-card">
        <div class="chart-header">
            <h2>Expense Analytics</h2>
        </div>
        <div class="chart-body">
            <canvas id="expense-chart"></canvas>
        </div>
    </div>
</section>

      <section class="bottom-section">
        <section class="transactions">
          <div class="transaction-header">
          <h2>Recent Transactions</h2>
            </div>
          <ul class="transaction-list">
            <li class="transaction-item">
              <div class="transaction-info">
              </div>

              <div class="transaction-actions">
              </div>
            </li>
          </ul>
        </section>

        <section class="add-expense">
          <div class="expense-header">
          <h2>Add Expense</h2>
            </div>
          <form class="expense-form">
            <input id="expense-title" type="text" placeholder="Expense Title" />
             <p class="error-message" id="title-error"></p>
            <input id="amount" type="number" placeholder="Amount" />
             <p class="error-message" id="amount-error"></p>
            <select id="category">
              <option>Food</option>
              <option>Transport</option>
              <option>Bills</option>
              <option>Shopping</option>
              <option>Entertainment</option>
              <option>Education</option>
              <option>Other</option>
            </select>

            <input id="date" type="date" />
             <p class="error-message" id="date-error"></p>
            <button id="submit-form" class="btn" type="submit">Add Transaction</button>
          </form>
        </section>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
